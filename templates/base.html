<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DIP Learning Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <span class="fs-4">🖼️ DIP Learning Dashboard</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">🏠 Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/interpolation">📏 Interpolation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/histogram">📊 Histogram</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/canny">🔍 Canny Edge</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/features">⭐ Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/cnn">🧠 CNN</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/transformations">🔄 Transformations</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Enhanced Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <p class="footer-text">
                    © 2026 All Rights Reserved | Built by <strong>Haris Shahzad</strong>
                </p>
                <div class="social-links">
                    <a href="https://github.com/Zenvila" target="_blank" class="social-link github" title="GitHub">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://linkedin.com/in/haris-shahzad786" target="_blank" class="social-link linkedin" title="LinkedIn">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="mailto:arainharis151@gmail.com" class="social-link email" title="Email">
                        <i class="fas fa-envelope"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
